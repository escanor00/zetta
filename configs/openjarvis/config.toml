# OpenJarvis configuration — GLM-4.7-Flash eval on 8x A100-80GB

# ═══════════════════════════════════════════════════════════════
# PILLAR 1: Intelligence — The Model
# ═══════════════════════════════════════════════════════════════
[intelligence]
default_model = "zai-org/GLM-4.7-Flash"   # HuggingFace model ID
fallback_model = "glm-4.7-flash"          # Catalog alias fallback
preferred_engine = "vllm"                 # MoE model, vLLM is best for A100s
provider = "local"                        # Running locally on this machine
quantization = "none"                     # Full precision, we have 640GB VRAM
# Generation defaults for eval
temperature = 0.0                         # Deterministic for reproducibility
max_tokens = 2048                         # Standard eval output length
top_p = 0.9
top_k = 40
repetition_penalty = 1.0

# ═══════════════════════════════════════════════════════════════
# PILLAR 2: Agent — The Agentic Harness
# ═══════════════════════════════════════════════════════════════
[agent]
default_agent = "native_openhands"        # CodeAct-style agent
max_turns = 10                            # Up to 10 tool-calling turns
tools = "code_interpreter,web_search,file_read,file_list,file_write,calculator,think"
objective = "Answer questions accurately using available tools"
context_from_memory = false               # No memory injection during eval

# ═══════════════════════════════════════════════════════════════
# PILLAR 3: Tools — MCP Interface
# ═══════════════════════════════════════════════════════════════
[tools.storage]
default_backend = "sqlite"
db_path = "~/.openjarvis/memory.db"

[tools.mcp]
enabled = true

# ═══════════════════════════════════════════════════════════════
# PILLAR 4: Engine — The Inference Runtime
# ═══════════════════════════════════════════════════════════════
[engine]
default = "vllm"

[engine.vllm]
host = "http://localhost:8001"            # vLLM serving port

[engine.ollama]
host = "http://localhost:11434"

[engine.sglang]
host = "http://localhost:30000"

[engine.llamacpp]
host = "http://localhost:8080"

[engine.exo]
host = "http://localhost:52415"

[engine.nexa]
host = "http://localhost:18181"
# device = "npu"  # optional: cpu, gpu, npu

[engine.uzu]
host = "http://localhost:8080"

[engine.apple_fm]
host = "http://localhost:8079"                # OpenAI-compatible shim

# In-process Apple Foundation Models (macOS 26+, Apple Intelligence enabled).
# Install with: uv pip install -e '.[afm]'
[engine.afm]
# instructions = ""                           # applied to every session
# use_case = "general"                        # or "content_tagging"
# guardrails = "default"                      # or "permissive_content_transformations"
sampling = "greedy"                           # or "random" (the SDK default)

# ═══════════════════════════════════════════════════════════════
# PILLAR 5: Learning — Improvement Methodologies
# ═══════════════════════════════════════════════════════════════
[learning]
enabled = false                           # No learning during eval

[learning.routing]
policy = "heuristic"

[learning.intelligence]
policy = "none"

[learning.agent]
policy = "none"

[learning.metrics]
accuracy_weight = 0.6
latency_weight = 0.2
cost_weight = 0.1
efficiency_weight = 0.1

# ═══════════════════════════════════════════════════════════════
# Supporting config
# ═══════════════════════════════════════════════════════════════
[telemetry]
enabled = true
db_path = "~/.openjarvis/telemetry.db"
gpu_metrics = true
gpu_poll_interval_ms = 50
energy_vendor = ""                       # Auto-detect; or force "nvidia"/"amd"/"apple"/"cpu_rapl"
warmup_samples = 0                       # Warmup iterations before steady-state measurement
steady_state_window = 5                  # Sliding window size for CV stability check
steady_state_threshold = 0.05            # Coefficient of variation threshold for steady state

[traces]
enabled = true                            # Record traces for analysis
db_path = "~/.openjarvis/traces.db"

[server]
# Bind to loopback by default so the API is not exposed to the local network.
# To serve other devices on your LAN, set host = "0.0.0.0" AND set an API key
# (OPENJARVIS_API_KEY / `jarvis auth generate-key`) — startup refuses a
# non-loopback bind without a key. The "server" security profile also flips
# this to 0.0.0.0 intentionally.
host = "127.0.0.1"
port = 8000
agent = "native_openhands"

[security]
allowed_dirs = []

# ═══════════════════════════════════════════════════════════════
# Voice Input/Output Configuration
# ═══════════════════════════════════════════════════════════════
[voice]
# Configurações de gravação e detecção de silêncio
sample_rate = 16000
silence_threshold = 500              # RMS abaixo disto = silêncio
silence_seconds = 1.5                # segundos de silêncio antes de parar
startup_silence_seconds = 5.0        # desiste se nunca começar a falar
max_record_seconds = 30              # limite de segurança

# Interrupção da fala do assistente
# IMPORTANTE: só ative interrupt_by_voice com fones de ouvido!
# Com caixas de som, o microfone ouve o assistente e ele se interrompe sozinho
interrupt_by_voice = false           # interromper falando por cima (requer fones)
voice_interrupt_threshold = 600      # volume mínimo da sua voz para interromper
voice_interrupt_chunks = 3           # quantos pedaços "com voz" necessários
voice_interrupt_window = 6           # entre os últimos N pedaços
interrupt_chunk_size = 512           # pedaços menores = reação mais rápida

[voice.tts]
# Text-to-Speech (TTS)
backend = "kokoro"                   # backend de síntese de voz
device = "cpu"                       # "cpu", "cuda", ou "auto" (detecta GPU)
voice_id = "af_heart"                # voz padrão (inglês americano feminina)
speed = 1.0                          # velocidade da fala (0.5 = lento, 2.0 = rápido)
max_cached_pipelines = 4             # quantos idiomas manter em cache

# ═══════════════════════════════════════════════════════════════
# Speech-to-Text e Text-to-Speech (sistema reconhece apenas [speech])
# ═══════════════════════════════════════════════════════════════
[speech]
backend = "faster-whisper"
model = "base"
device = "cpu"
compute_type = "int8"
language = ""
tts_backend = "kokoro"
tts_device = "cpu"                   # device para TTS (será passado ao backend)
tts_max_cached_pipelines = 4
voice_id = "af_heart"
voice_speed = 1.0
